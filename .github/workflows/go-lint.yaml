name: Go lint

on:
  workflow_call:
    inputs:
      go_version: 
        type: string
        default: "1.27"
      golangci_lint_version:
        type: string
        default: "v2.15"
      ubuntu_version:
        type: string
        default: "ubuntu-26.04"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ inputs.ubuntu_version }}
    steps:
      - name: Checkout repository and setup Go toolchain
        uses: RJZauner/pipeline-lib/.github/actions/go-setup@main
        with:
          go_version: ${{ inputs.go_version }}

      - name: Go linting
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci_lint_action }}

name: Go test

on:
  workflow_call:
    inputs: 
      go_version:
        type: string
        default: "1.27"
      test_args:
        type: string
        default: --race -covermode=atomic -coverprofile=coverage.out ./...
      ubuntu_version:
        type: string
        default: "ubuntu-26.04"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.ubuntu_version }}
    steps:
      - name: Checkout repository and setup Go toolchain
        uses: RJZauner/pipeline-lib/.github/actions/go-setup@main
        with:
          go_version: ${{ inputs.go_version }}

      - name: Go testing
        env: 
          TEST_ARGS: ${{ inputs.test_args }}
        run: go test $TEST_ARGS

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

